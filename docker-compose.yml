# Core stack: postgres, redis, api, price-service, client.
# Centrifugo arrives in phase 3 behind the `push` profile, so the polling
# version stays honestly standalone rather than push-minus-a-flag.

x-python-env: &python-env
  ALBERT_API_KEY: ${ALBERT_API_KEY:?set ALBERT_API_KEY in .env}
  ALBERT_API_BASE: ${ALBERT_API_BASE:-https://app.albert.com/casestudy}
  POSTGRES_DSN: postgresql://postgres:postgres@db:5432/postgres
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: ${JWT_SECRET:-dev-only-not-a-secret}
  PRICE_SOURCE: ${PRICE_SOURCE:-api}
  PUBLISH_INTERVAL_SECONDS: ${PUBLISH_INTERVAL_SECONDS:-5}
  UPSTREAM_POLL_INTERVAL_SECONDS: ${UPSTREAM_POLL_INTERVAL_SECONDS:-5}
  PRICE_CACHE_TTL_SECONDS: ${PRICE_CACHE_TTL_SECONDS:-60}
  LATEST_PRICE_SOURCE: ${LATEST_PRICE_SOURCE:-redis}
  SIM_VOLATILITY: ${SIM_VOLATILITY:-0.002}
  SIM_CHANGE_RATIO: ${SIM_CHANGE_RATIO:-0.30}
  SIM_SEED: ${SIM_SEED:-1}
  TRANSPORT: ${TRANSPORT:-poll}
  UVICORN_ARGS: ${UVICORN_ARGS:-}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Non-default host port so this stack can run beside another local
      # Postgres. Traffic between containers still uses 5432.
      - "${POSTGRES_HOST_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    hostname: redis
    ports:
      - "${REDIS_HOST_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  # Business APIs only. It does not own realtime fanout.
  api:
    image: watchlist-api:local
    build: .
    hostname: api
    environment: *python-env
    # --reload for development; benchmarks override UVICORN_ARGS with
    # "--workers N". A single-process dev server saturates one core almost
    # immediately, which would measure Python's GIL rather than the design.
    command:
      - sh
      - -c
      - exec uvicorn watchlist.api.main:app --host 0.0.0.0 --port 8000 ${UVICORN_ARGS:---reload}
    volumes:
      # Development convenience: edits take effect without a rebuild. The image
      # already contains a full copy of all three, so dropping these mounts for
      # a self-contained runtime is a three-line change.
      - ./src:/app/src
      - ./tools:/app/tools
      - ./migrations:/app/migrations
    ports:
      - "8000:8000"
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 5s
      timeout: 5s
      retries: 12

  # The only writer of prices anywhere in the system, and the only caller of
  # the vendor API - one call per tick, regardless of how many users exist.
  price-service:
    image: watchlist-api:local
    build: .
    hostname: price-service
    environment: *python-env
    command: python -m watchlist.price_service
    restart: unless-stopped
    volumes:
      - ./src:/app/src
      - ./seed:/app/seed
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  client:
    image: watchlist-client:local
    build:
      context: ./client
      dockerfile: Dockerfile
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
      VITE_TRANSPORT: ${TRANSPORT:-poll}
      VITE_POLL_INTERVAL_SECONDS: ${PUBLISH_INTERVAL_SECONDS:-5}
    volumes:
      - ./client:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - api

  # Not part of the product. Runs only under the `load` profile, with
  # explicit arguments, and never as part of `make up`.
  #
  # Running the generator in a container rather than on the host is the
  # discriminator for "is this ceiling the application or the environment":
  # it has its own ephemeral port range and file descriptor limits, and it
  # reaches the API over the Compose network instead of through Docker
  # Desktop's host port forwarding.
  load-generator:
    image: watchlist-loadgen:local
    profiles: ["load"]
    build:
      context: ./tools/load_generator
      dockerfile: Dockerfile
    environment:
      API_BASE: http://api:8000
      JWT_SECRET: ${JWT_SECRET:-dev-only-not-a-secret}
    ulimits:
      nofile: { soft: 200000, hard: 200000 }
    sysctls:
      # 20k outbound connections to one destination exhausts the default
      # ephemeral range before anything in the application breaks.
      net.ipv4.ip_local_port_range: "10000 65535"
    depends_on:
      api: { condition: service_healthy }

volumes:
  postgres_data:
