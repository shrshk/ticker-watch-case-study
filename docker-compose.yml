# Core stack: postgres, redis, api, price-service, client.
# Centrifugo is the push transport behind the `push` profile, so the polling
# version stays honestly standalone rather than push-minus-a-flag.

x-python-env: &python-env
  # Optional: only PRICE_SOURCE=api needs it, and the source adapter fails
  # loudly if it is missing then. Requiring it here would stop a reviewer
  # without a key from running the stack in simulated mode at all.
  ALBERT_API_KEY: ${ALBERT_API_KEY:-}
  ALBERT_API_BASE: ${ALBERT_API_BASE:-https://app.albert.com/casestudy}
  POSTGRES_DSN: postgresql://postgres:postgres@db:5432/postgres
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: ${JWT_SECRET:-dev-only-not-a-secret}
  PRICE_SOURCE: ${PRICE_SOURCE:-api}
  PUBLISH_INTERVAL_SECONDS: ${PUBLISH_INTERVAL_SECONDS:-5}
  UPSTREAM_POLL_INTERVAL_SECONDS: ${UPSTREAM_POLL_INTERVAL_SECONDS:-5}
  PRICE_CACHE_TTL_SECONDS: ${PRICE_CACHE_TTL_SECONDS:-60}
  LATEST_PRICE_SOURCE: ${LATEST_PRICE_SOURCE:-redis}
  SIM_VOLATILITY: ${SIM_VOLATILITY:-0.002}
  SIM_CHANGE_RATIO: ${SIM_CHANGE_RATIO:-0.30}
  SIM_SEED: ${SIM_SEED:-1}
  TRANSPORT: ${TRANSPORT:-push}
  UVICORN_ARGS: ${UVICORN_ARGS:-}
  CENTRIFUGO_API_URL: http://centrifugo:8000/api
  CENTRIFUGO_API_KEY: ${CENTRIFUGO_HTTP_API_KEY:-dev-only-centrifugo-api-key}
  DB_POOL_MIN_SIZE: ${DB_POOL_MIN_SIZE:-2}
  DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-16}

services:
  db:
    image: postgres:16-alpine
    # Default is 100, which an 8-worker API exhausts: each worker opens its own
    # pool, so the total is workers x DB_POOL_MAX_SIZE plus the price service.
    command: postgres -c max_connections=200
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Everything in db/ is loaded by the official image ONLY when the data
      # directory is empty - a reviewer's first start gets the demo state; an
      # existing volume is never touched. The whole directory is mounted, not
      # the file: a bind mount of a missing file becomes an empty directory
      # named demo.sql, which the entrypoint tries to run and dies on.
      - ./db:/docker-entrypoint-initdb.d:ro
    ports:
      # Non-default host port so this stack can run beside another local
      # Postgres. Traffic between containers still uses 5432.
      - "${POSTGRES_HOST_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    hostname: redis
    ports:
      - "${REDIS_HOST_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  # Business APIs only. It does not own realtime fanout.
  api:
    image: watchlist-api:local
    build: .
    hostname: api
    environment: *python-env
    # --reload for development; benchmarks override UVICORN_ARGS with
    # "--workers N". A single-process dev server saturates one core almost
    # immediately, which would measure Python's GIL rather than the design.
    command:
      - sh
      - -c
      - exec uvicorn watchlist.api.main:app --host 0.0.0.0 --port 8000 ${UVICORN_ARGS:---reload}
    volumes:
      # Development convenience: edits take effect without a rebuild. The image
      # already contains a full copy of all three, so dropping these mounts for
      # a self-contained runtime is a three-line change.
      - ./src:/app/src
      - ./tools:/app/tools
      - ./migrations:/app/migrations
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 5s
      timeout: 5s
      retries: 12

  # The only writer of prices anywhere in the system, and the only caller of
  # the vendor API - one call per tick, regardless of how many users exist.
  price-service:
    image: watchlist-api:local
    build: .
    hostname: price-service
    environment: *python-env
    command: python -m watchlist.price_service
    restart: unless-stopped
    ports:
      - "8002:8002"   # /metrics
    # The loop touches /tmp/heartbeat every tick. Without this, `up --wait`
    # reports the service healthy while it is refusing to start or stuck.
    healthcheck:
      test: ["CMD-SHELL", "test $$(( $$(date +%s) - $$(stat -c %Y /tmp/heartbeat 2>/dev/null || echo 0) )) -lt 30"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 90s
    volumes:
      - ./src:/app/src
      - ./seed:/app/seed
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  client:
    image: watchlist-client:local
    build:
      context: ./client
      dockerfile: Dockerfile
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
      VITE_TRANSPORT: ${TRANSPORT:-push}
      VITE_CENTRIFUGO_URL: ${VITE_CENTRIFUGO_URL:-ws://localhost:8001/connection/websocket}
      VITE_POLL_INTERVAL_SECONDS: ${PUBLISH_INTERVAL_SECONDS:-5}
    volumes:
      - ./client:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - api

  # All client-facing realtime: connections, subscriptions, reconnects, fanout.
  # `push` profile only, so the polling version stays honestly standalone. The
  # engine is configured, not coded: the NATS override swaps the config file
  # and adds a broker, with no application code touched.
  centrifugo:
    image: centrifugo/centrifugo:v6
    profiles: ["push"]
    command: centrifugo -c /centrifugo/config.json
    volumes:
      - ./centrifugo/config.redis.json:/centrifugo/config.json:ro
    environment:
      # The same secret the API signs access tokens with, so a connection
      # token is a claims transform rather than a second auth system.
      CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY: ${JWT_SECRET:-dev-only-not-a-secret-but-at-least-32-bytes}
      CENTRIFUGO_HTTP_API_KEY: ${CENTRIFUGO_HTTP_API_KEY:-dev-only-centrifugo-api-key}
    ports:
      - "8001:8000"
    ulimits:
      nofile: { soft: 200000, hard: 200000 }
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Not part of the product. Runs only under the `load` profile, with
  # explicit arguments, and never as part of `make up`.
  #
  # Running the generator in a container rather than on the host is the
  # discriminator for "is this ceiling the application or the environment":
  # it has its own ephemeral port range and file descriptor limits, and it
  # reaches the API over the Compose network instead of through Docker
  # Desktop's host port forwarding.
  load-generator:
    image: watchlist-loadgen:local
    profiles: ["load"]
    build:
      context: ./tools/load_generator
      dockerfile: Dockerfile
    environment:
      API_BASE: http://api:8000
      CENTRIFUGO_URL: ws://centrifugo:8000/connection/websocket
      JWT_SECRET: ${JWT_SECRET:-dev-only-not-a-secret-but-at-least-32-bytes}
    ulimits:
      nofile: { soft: 200000, hard: 200000 }
    sysctls:
      # 20k outbound connections to one destination exhausts the default
      # ephemeral range before anything in the application breaks.
      net.ipv4.ip_local_port_range: "10000 65535"
    depends_on:
      api: { condition: service_healthy }

volumes:
  postgres_data:
