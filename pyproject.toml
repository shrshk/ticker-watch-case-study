[project]
name = "watchlist"
version = "0.1.0"
description = "Stock watchlist service - Albert product engineering case study"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "asyncpg>=0.30",
    "redis>=5.2",
    "httpx>=0.28",
    "pyjwt>=2.10",
    "bcrypt>=4.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/watchlist"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "G", "LOG", "TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# One way to get a logger, so a later swap to structured logging is a
# single-file change. Mirrors the rule the OTTO codebase enforces.
"logging".msg = "Use watchlist.shared.logging.get_logger instead."

[tool.ruff.lint.per-file-ignores]
"src/watchlist/shared/logging.py" = ["TID251"]
"tools/**" = ["TID251"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's whole dependency system is calls in argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body", "fastapi.Header"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
